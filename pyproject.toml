[project]
name = "once"
version = "0.8.0"
description = "Memory for coding agents: capture sessions, inject reviewed rules, learn from outcomes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
once = "once.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/once"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
