name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: git identity for the tests' throwaway repos
        run: |
          git config --global user.name "once CI"
          git config --global user.email "ci@localhost"
          git config --global init.defaultBranch main
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
      - name: Demo runs end to end
        run: uv run once demo --json

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Byte-compile everything
        run: uv run python -m compileall -q src tests
      - name: Editor extension parses
        run: node --check src/once/editor/vscode/extension.js
      - name: Version is the same everywhere
        run: |
          py=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(uv run python -c "import sys;sys.path.insert(0,'src');import once;print(once.__version__)")
          ext=$(node -p "require('./src/once/editor/vscode/package.json').version")
          echo "pyproject $py, package $init, extension $ext"
          test "$py" = "$init" && test "$py" = "$ext"
      - name: Build
        run: uv build
      - name: The wheel carries its assets
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["once/demo_assets/agent.py", "once/assets/fonts/geist-sans-latin-400-normal.woff2",
                  "once/editor/vscode/extension.js", "once/editor/vscode/package.json"]
          missing = [n for n in need if n not in names]
          assert not missing, missing
          print(len(names), "files in the wheel")
          EOF
      - name: Install the wheel and run it
        run: |
          uv venv /tmp/w && uv pip install --python /tmp/w/bin/python dist/*.whl
          /tmp/w/bin/once --version
          /tmp/w/bin/once demo --json
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
