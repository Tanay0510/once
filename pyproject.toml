[project]
name = "once"
version = "0.9.0"
description = "Your coding agent makes each mistake once: rules learned from Claude Code, Codex and Antigravity sessions."
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Tanay Bhardwaj" }]
keywords = ["claude-code", "codex", "antigravity", "coding-agents", "ai-agents", "agent-memory", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/Tanay0510/once"
Documentation = "https://github.com/Tanay0510/once/blob/main/docs/guide.md"
Changelog = "https://github.com/Tanay0510/once/blob/main/CHANGELOG.md"
Issues = "https://github.com/Tanay0510/once/issues"

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
once = "once.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/once"]
core-metadata-version = "2.4"   # what PyPI is known to accept; 2.4 is enough for License-Expression

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
